<text x="48.0" y="44.5" text-anchor="middle" dominant-baseline="central" fill="#1a1a1e" font-family="ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="24" font-weight="600" letter-spacing=".04em">in</text>
