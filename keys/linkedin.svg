<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 98" width="96" height="98" role="img" aria-label="LinkedIn">
<title>LinkedIn</title>
<defs>
<linearGradient id="e" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#848488"/><stop offset=".42" stop-color="#9e9ea2"/><stop offset="1" stop-color="#848488"/></linearGradient>
<linearGradient id="c" x1="0" y1="0" x2=".2" y2="1"><stop offset="0" stop-color="#e2e1de"/><stop offset=".38" stop-color="#c5c5c7"/><stop offset="1" stop-color="#9e9ea2"/></linearGradient>
<radialGradient id="s" cx=".3" cy=".08" r="1"><stop offset="0" stop-color="#fff" stop-opacity=".3"/><stop offset=".46" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="b" x1="0" y1="0" x2="0" y2="1"><stop offset=".7" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".32"/></linearGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity=".55"/></filter>
