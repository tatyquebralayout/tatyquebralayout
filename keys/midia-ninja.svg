<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 98" width="192" height="98" role="img" aria-label="Contos na Mídia Ninja">
<title>Contos na Mídia Ninja</title>
<defs>
<linearGradient id="e" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6f5e45"/><stop offset=".42" stop-color="#937d5c"/><stop offset="1" stop-color="#6f5e45"/></linearGradient>
<linearGradient id="c" x1="0" y1="0" x2=".2" y2="1"><stop offset="0" stop-color="#ebd6b3"/><stop offset=".38" stop-color="#c4ab84"/><stop offset="1" stop-color="#937d5c"/></linearGradient>
<radialGradient id="s" cx=".3" cy=".08" r="1"><stop offset="0" stop-color="#fff" stop-opacity=".3"/><stop offset=".46" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="b" x1="0" y1="0" x2="0" y2="1"><stop offset=".7" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".32"/></linearGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity=".55"/></filter>
</defs>
<style>
.k{animation:press 7s cubic-bezier(.25,.8,.35,1) 0.25s infinite;transform-box:fill-box;transform-origin:center}
@keyframes press{0%{transform:none}2.5%{transform:translateY(4px) scale(.965)}6%,100%{transform:none}}
@media (prefers-reduced-motion:reduce){.k{animation:none}}
</style>
<g class="k" filter="url(#sh)">
<rect x="4" y="2" width="184" height="88" rx="13" fill="url(#e)"/>
<rect x="7" y="5" width="178" height="79" rx="10" fill="url(#c)"/>
<rect x="7" y="5" width="178" height="79" rx="10" fill="url(#s)"/>
<rect x="7" y="5" width="178" height="79" rx="10" fill="url(#b)"/>
<text x="96.0" y="44.5" text-anchor="middle" dominant-baseline="central" fill="#1a140d" font-family="ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="19" font-weight="700" letter-spacing=".04em">Mídia Ninja</text>
</g>
</svg>