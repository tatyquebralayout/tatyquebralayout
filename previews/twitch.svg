<svg xmlns="http://www.w3.org/2000/svg" width="480" height="160" viewBox="0 0 480 160" role="img" aria-labelledby="t"><title id="t">Indicador "ao vivo" piscando e um relógio de foco girando, como numa live de co-estudo</title><style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<style>.dot{animation:b 1.6s ease-in-out infinite}@keyframes b{50%{opacity:.2}}
