<svg xmlns="http://www.w3.org/2000/svg" width="480" height="160" viewBox="0 0 480 160" role="img" aria-labelledby="t"><title id="t">Linhas de texto sendo escritas numa página, como um conto surgindo</title><style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<style>.l{fill:#111;transform-origin:left;animation:w 4s infinite}.l2{animation-delay:.6s}.l3{animation-delay:1.2s}.l4{animation-delay:1.8s}
